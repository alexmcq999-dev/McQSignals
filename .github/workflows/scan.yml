name: Scan signals

on:
  schedule:
    - cron: "1,16,31,46 * * * *"   # через минуту после закрытия каждой 15m свечи (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
        run: python scan.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "mcq-bot"
          git config user.email "mcq-bot@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
