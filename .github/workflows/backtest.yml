name: Backtest

on:
  schedule:
    - cron: "17 5 * * 0"   # каждое воскресенье 08:17 МСК
  workflow_dispatch:
    inputs:
      days:
        description: "Период, дней"
        default: "60"
      symbols:
        description: "Сколько монет (топ по ликвидности)"
        default: "25"
      grid:
        description: "Перебор порогов (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '60' }} --symbols ${{ github.event.inputs.symbols || '25' }}"
          if [ "${{ github.event.inputs.grid }}" = "true" ]; then ARGS="$ARGS --grid"; fi
          python backtest.py $ARGS
          cat reports/*latest.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/

      - name: Commit report
        run: |
          git config user.name  "mcq-bot"
          git config user.email "mcq-bot@users.noreply.github.com"
          git add reports/*.md state/universe.json || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "backtest report [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
