name: Backtest

on:
  schedule:
    - cron: "17 5 * * 0"   # каждое воскресенье 08:17 МСК
  workflow_dispatch:
    inputs:
      days:
        description: "Период, дней"
        default: "60"
      symbols:
        description: "Сколько монет (топ по ликвидности)"
        default: "25"
      mode:
        description: "report — обычный отчёт · grid — перебор порогов · experiments — сравнение вариантов (120д)"
        type: choice
        options: [report, grid, experiments]
        default: report

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
        run: |
          MODE="${{ github.event.inputs.mode || 'report' }}"
          ARGS="--symbols ${{ github.event.inputs.symbols || '25' }}"
          if [ "$MODE" = "experiments" ]; then
            python backtest.py $ARGS --experiments
            cat reports/experiments_latest.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = "grid" ]; then
            python backtest.py $ARGS --days ${{ github.event.inputs.days || '60' }} --grid
            cat reports/grid_latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            python backtest.py $ARGS --days ${{ github.event.inputs.days || '60' }}
            cat reports/backtest_latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/

      - name: Commit report
        run: |
          git config user.name  "mcq-bot"
          git config user.email "mcq-bot@users.noreply.github.com"
          git add reports/ state/universe.json || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "backtest report [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
