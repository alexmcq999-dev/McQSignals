# ===================== McQ Signals v4 — настройки =====================
# Меняй параметры здесь, код трогать не нужно.

universe:
  min_market_cap_usd: 100000000      # капитализация от $100M
  min_quote_volume_24h_usd: 15000000 # ликвидность на бирже за 24ч
  max_assets: 60                     # сколько самых ликвидных монет сканировать
  quote: USDT
  refresh_hours: 12                  # как часто обновлять список монет (CoinGecko)
  extra_exclude: []                  # свои исключения, например: [PEPE, WIF]

timeframes:
  entry: 1h        # таймфрейм входа (v1/v2 были на 15m — комиссии съедали преимущество)
  confirm: 4h      # старший ТФ — фильтр тренда
  track: 15m       # по каким свечам сопровождать открытые сигналы (быстрее уведомления)
  bars_entry: 600  # нужно >= 260 для EMA200
  bars_confirm: 400

# v4: откуда берутся сигналы
#   breakout — пробойные сетапы: паттерн ищется заранее, вход только на подтверждённом пробое (src/setups.py)
#   trend    — трендовый консенсус v3 (входил поздно, на хаях/лоях: в живой работе 2 плюса из 18)
#   both     — оба источника
# v4.1 (19.10.2026): эксперименты на 360 днях — пробои 7 сделок за год и в минусе, мягкий тренд в минусе
# в последнем периоде; единственный вариант в плюсе во всех периодах (два прогона подряд) — строгий тренд.
strategy:
  mode: trend

# Пробойные сетапы (лонг — сопротивление сверху; шорт — зеркально, поддержка снизу)
breakout:
  base_bars: 36            # окно базы, свечей 1H
  min_span_bars: 10        # первое и последнее касание уровня — не ближе 10 свечей
  touch_tol_atr: 0.3       # касание = локальный максимум в пределах 0.3 ATR от уровня
  min_touches: 2
  min_height_atr: 1.5      # высота базы в ATR: уже — шум, шире — не база
  max_height_atr: 8.0
  bbw_lookback: 120        # перцентиль ширины Боллинджера (сжатие) за 120 свечей
  vol_z_min: 1.0           # объём свечи пробоя выше нормы
  close_pos_min: 0.5       # свеча пробоя закрылась в верхней половине (шорт — в нижней)
  close_buffer_atr: 0.05
  max_ext_atr: 4.0         # цена дальше 4 ATR от EMA50 — перегрев, не входим
  entry_mode: auto         # auto — по рынку, а если свеча ушла > chase_max_atr — лимит на ретест · market · retest
  chase_max_atr: 0.5
  retest_bars: 6           # лимит действует 6 свечей, потом отменяется
  retest_offset_atr: 0.1
  stop_buffer_atr: 0.25    # стоп за минимумом последней трети базы (последний повышающийся минимум)
  min_score: 75            # слабые и средние сетапы пропускаем
  alert_score: 70          # «готовится пробой» — оценка сетапа до пробоя
  alert_near_atr: 1.0      # цена не дальше 1 ATR от уровня
  require_htf: true        # тренд 4H не против
  max_alerts_per_run: 3

signals:
  min_score: 70            # порог силы трендового сигнала 0..100
  min_agree: 5             # минимум трендовых модулей «за»
  require_htf: true
  htf_mode: strict         # v4.1: strict — тренд 4H монеты ПО направлению сделки
  btc_filter: true
  btc_mode: block          # v4.1: block — против тренда BTC 4H не торгуем; penalty — только штраф
  sides: both              # both | long_only | short_only
  strict_shorts: true      # v4.1: шорт только когда 4H монеты И 4H BTC медвежьи
  cooldown_minutes: 480
  max_signals_per_run: 5
  max_open_signals: 20
  atr_pct_min: 0.2
  atr_pct_max: 8.0
  lookback_bars_on_run: 2
  max_signal_age_minutes: 75  # сигнал со свечи старше — не отправляем (задержки Actions)
  max_ext_atr: 0            # v4, для режима trend: не входить дальше N ATR от EMA20 (0 — выкл.)
  rsi_cap: 0                # v4, для режима trend: не покупать при RSI > N и не шортить при RSI < 100−N (0 — выкл.)
  entry_mode: market        # v4.1: market — по закрытию свечи · pullback — лимит на откат (не догонять импульс)
  pullback_atr: 0.5         # pullback: лимит на 0.5 ATR лучше закрытия сигнальной свечи
  pullback_bars: 6          # pullback: лимит действует 6 свечей
  modules:                 # трендовый консенсус (контртрендовые модули — в разделе contrarian)
    - ema_trend
    - supertrend
    - pullback
    - macd
    - rsi_regime
    - stoch_rsi
    - donchian
    - squeeze
    - bb_reversion
    - rsi_divergence
    - vwap_obv

# Против толпы и манипуляций
# v3.1: контртрендовая ветка ВЫКЛЮЧЕНА — на 360 днях она проиграла в 2 из 3 периодов (−0.09R/сделку).
# Фильтр толпы для трендовых сигналов ОСТАВЛЕН — он улучшил результат во всех трёх периодах.
contrarian:
  enabled: false
  trigger: sweep           # обязательный триггер: снятие стопов за 20-барным экстремумом и возврат
  confirm: [crowd, fng]    # подтверждение: перекос толпы на фьючерсах и/или экстремум Fear & Greed
  min_confirm: 1
  ignore_htf: true         # контртренд по определению может идти против старшего тренда
  base_conf: 60
  crowd_filter: true       # трендовые сигналы: не входить туда, где толпа уже перегружена
  crowd_filter_z: 2.0
  fng_filter: true         # v3.3 (с 01.10.2026): не покупать при F&G ≥ 80 и не шортить при ≤ 20
  fng_greed: 80
  fng_fear: 20

crowd:
  days: 20                 # сколько дней Binance metrics держать для z-оценки
  z_window_days: 14
  publish_delay_hours: 8   # файл за день D считаем доступным с D+1 08:00 UTC

# Оценочная карта ликвидаций (src/liqmap.py): OI Binance по часам + типичные плечи.
# Это модель, а не реальные позиции; позиции последних ~суток не видны (файлы публикуются на след. день).
liqmap:
  enabled: true
  symbols: [BTC, ETH, SOL, XRP, DOGE, BNB]
  days: 14            # позиции за последние 14 дней
  range_pct: 12       # карта ±12% от текущей цены
  bins: 48
  mmr: 0.005          # поддерживающая маржа
  leverage: {5: 0.10, 10: 0.30, 20: 0.25, 50: 0.20, 100: 0.15}   # доля новых позиций по плечам

# Новостной фон из бота marketnews999 (только в боевом режиме: на истории не проверить)
news:
  enabled: true
  url: https://mcqcryptonews.pages.dev/data/app.json
  calendar_blackout_minutes: 45  # не давать новые сигналы за 45 мин до и после High-impact макро-события
  show_in_signal: true           # показывать новостной фон в сообщении
  against_news_filter: false     # не открывать сделку против свежего (≤ 12ч) официального 🏛 события
  alert_minutes: 40              # алерт в Telegram за ≤ 40 мин до High-события (скан раз в ~15 мин)

# Макро-режим: DXY против альтов (src/macro.py)
# Фильтр включается ТОЛЬКО когда связь реально есть: корреляция недельных доходностей
# драйвера и корзины альтов (топ без BTC/ETH ≈ TOTAL3) за corr_weeks ≤ corr_on.
# Тогда: DXY ↑ → лонги против макро, DXY ↓ → шорты против макро.
macro:
  mode: shadow             # off | shadow (только наблюдение и статистика) | penalty | block
  corr_weeks: 26           # окно корреляции, недель (~полгода)
  corr_on: -0.5            # связь считается активной при корреляции ≤ −0.5
  penalty: 10              # mode: penalty — минус к силе сигнала против макро
  basket_size: 10          # сколько альтов в корзине (прокси TOTAL3)
  refresh_hours: 6         # данные недельные — обновлять чаще незачем
  notify_changes: true     # сообщение в Telegram, когда макро-режим меняется (не чаще раза в неделю)
  drivers:
    - name: DXY
      yahoo: "DX-Y.NYB"
      fred: DTWEXBGS       # резерв: широкий индекс доллара ФРС (уровень другой, динамика близкая)
      ecb: "1/EURUSD"      # последний резерв: 1/EURUSD по курсам ЕЦБ (евро ≈ 58% DXY)
      trend_ema_weeks: 10  # тренд: недельное закрытие против EMA(10)
      trend_band_pct: 0.5  # мёртвая зона ±0.5% — внутри неё тренд «нейтральный»
      enabled: true
    - name: US10Y
      yahoo: "^TNX"
      fred: DGS10
      trend_ema_weeks: 10
      trend_band_pct: 2.0  # доходности волатильнее индекса доллара
      enabled: false       # включи, если CC альтов с US10Y тоже держится ниже −0.5

risk:
  sl_min_atr: 1.0
  sl_max_atr: 2.5
  sl_swing_buffer_atr: 0.25
  sl_max_pct: 6.0
  sl_min_pct: 0.0
  max_cost_r: 0.2          # пропускать сделку, если комиссии туда-обратно > 0.2R
  tp1_r: 1.5               # TP1 = 1.5R, закрываем часть и стоп в б/у
  tp1_close_frac: 0.5
  exit_mode: trail         # trail — остаток ведём трейлинг-стопом; fixed — остаток на TP2
  trail_atr: 3.0           # трейлинг = лучшая цена − 3 ATR
  tp2_r: 3.0               # используется только при exit_mode: fixed
  ttl_hours: 168           # максимум 7 дней в сделке
  risk_per_trade_pct: 0.5  # макс. просадка на истории ~35R → при 0.5% это ~17% депозита

costs:                     # издержки на ОДНУ сторону сделки
  fee_pct: 0.045           # фьючерсы Binance USDT-M taker с BNB. Для спота поставь 0.075
  slippage_pct: 0.03

backtest:
  days: 180
  symbols: 25
  experiments_days: 360    # --experiments: 3 периода по 120 дней
  folds: 3

telegram:
  allow_public_subscribe: true
  brief_hour_local: 8            # «План дня» — первый скан после 08:00 по timezone (до полудня)
  timezone: Europe/Moscow
  test_mode: true                # 🧪 пометка «ТЕСТ» на сигналах, пока стратегия не прошла проверку

# Варианты для `python backtest.py --experiments` — все на одних данных, 3 периода.
# Рабочий вариант — в плюсе во ВСЕХ периодах.
experiments:
  - name: "v4.1 (config): строгий тренд 4H+BTC, вход по рынку"
    set: {}
  - name: "строгий + лимит на откат 0.5 ATR"
    set: {signals: {entry_mode: pullback, pullback_atr: 0.5}}
  - name: "строгий + лимит на откат 1 ATR"
    set: {signals: {entry_mode: pullback, pullback_atr: 1.0}}
  - name: "строгий + не дальше 2 ATR от EMA20"
    set: {signals: {max_ext_atr: 2.0}}
  - name: "строгий + RSI-кап 70/30"
    set: {signals: {rsi_cap: 70}}
  - name: "строгий + откат 0.5 ATR + RSI-кап 70/30"
    set: {signals: {entry_mode: pullback, pullback_atr: 0.5, rsi_cap: 70}}
  - name: "строгий, сила ≥ 75"
    set: {signals: {min_score: 75}}
  - name: "строгий, трейлинг 2 ATR"
    set: {risk: {trail_atr: 2.0}}
  - name: "строгий без фильтра толпы"
    set: {contrarian: {crowd_filter: false}}
  - name: "мягкий тренд v3.3 (как было в живой работе)"
    set: {signals: {htf_mode: loose, btc_mode: penalty, strict_shorts: false}}
  - name: "мягкий тренд + лимит на откат 1 ATR"
    set: {signals: {htf_mode: loose, btc_mode: penalty, strict_shorts: false, entry_mode: pullback, pullback_atr: 1.0}}
  - name: "строгий, только лонги (справочно)"
    set: {signals: {sides: long_only}}
  - name: "пробои v4, сила ≥ 65 (справочно)"
    set: {strategy: {mode: breakout}, breakout: {min_score: 65}}
